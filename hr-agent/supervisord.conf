[supervisord]
nodaemon=true
user=root
logfile=/var/log/hiring-agent/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/hiring-agent

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# ---- Data services ----------------------------------------------------

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
user=postgres
autorestart=true
priority=10
stdout_logfile=/var/log/hiring-agent/postgres.log
stderr_logfile=/var/log/hiring-agent/postgres.err.log

[program:redis]
command=/usr/bin/redis-server --bind 127.0.0.1 --appendonly yes --dir /data
autorestart=true
priority=10
stdout_logfile=/var/log/hiring-agent/redis.log
stderr_logfile=/var/log/hiring-agent/redis.err.log

[program:minio]
command=/usr/local/bin/minio server /data/minio --address ":9000" --console-address ":9001"
environment=MINIO_ROOT_USER="minioadmin",MINIO_ROOT_PASSWORD="minioadmin"
autorestart=true
priority=10
stdout_logfile=/var/log/hiring-agent/minio.log
stderr_logfile=/var/log/hiring-agent/minio.err.log

[program:mailhog]
command=/usr/local/bin/mailhog -smtp-bind-addr 127.0.0.1:1025 -ui-bind-addr 0.0.0.0:8025 -api-bind-addr 0.0.0.0:8025
autorestart=true
priority=10
stdout_logfile=/var/log/hiring-agent/mailhog.log
stderr_logfile=/var/log/hiring-agent/mailhog.err.log

# ---- One-shot init (creates DB extensions + MinIO buckets) -----------

[program:init]
command=/usr/local/bin/entrypoint.sh run-init
autorestart=false
startsecs=0
exitcodes=0
priority=20
stdout_logfile=/var/log/hiring-agent/init.log
stderr_logfile=/var/log/hiring-agent/init.err.log

# ---- Application ------------------------------------------------------

[program:api]
command=uvicorn src.api.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
autorestart=true
priority=30
stdout_logfile=/var/log/hiring-agent/api.log
stderr_logfile=/var/log/hiring-agent/api.err.log

[program:worker]
command=arq src.workers.main.WorkerSettings
directory=/app/backend
autorestart=true
priority=30
stdout_logfile=/var/log/hiring-agent/worker.log
stderr_logfile=/var/log/hiring-agent/worker.err.log

[program:frontend]
command=node server.js
directory=/app/frontend
environment=PORT="3100",HOSTNAME="0.0.0.0",NODE_ENV="production",NEXT_TELEMETRY_DISABLED="1"
autorestart=true
priority=30
stdout_logfile=/var/log/hiring-agent/frontend.log
stderr_logfile=/var/log/hiring-agent/frontend.err.log
