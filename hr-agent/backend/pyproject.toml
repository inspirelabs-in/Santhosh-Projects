[project]
name = "hiring-agent"
version = "0.1.0"
description = "AI-powered recruitment automation agent for GrabOn (Inspirelabs Solutions Pvt. Ltd.)"
requires-python = ">=3.12"
authors = [{ name = "GrabOn HR Engineering" }]

dependencies = [
    # Web / API
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",

    # Workflow orchestration
    "temporalio>=1.18.0",

    # LLM
    "litellm>=1.83.0",
    "anthropic>=0.100.0",
    "langfuse>=2.60.0",  # 4.x compat shims in llm/client.py
    "tiktoken>=0.8.0",
    "langgraph>=1.1.0",

    # Database
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.4",
    "alembic>=1.18.0",
    "pgvector>=0.4.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",

    # Storage
    "boto3>=1.35.0",         # R2 is S3-compatible

    # Resume parsing
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=11.0.0",

    # Channels
    "resend>=2.4.0",
    "aiosmtplib>=3.0.2",       # SMTP fallback (MailHog for dev, any SMTP for prod)
    "slack-sdk>=3.33.0",

    # Calendar
    "google-api-python-client>=2.150.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-cloud-pubsub>=2.27.0",

    # Utilities
    "rapidfuzz>=3.10.0",       # fuzzy dedup matching
    "phonenumbers>=8.13.0",    # phone normalisation
    "python-jose[cryptography]>=3.3.0",  # JWT-signed screening URLs
    "cryptography>=43.0.0",              # Fernet encryption for config secrets
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "python-dateutil>=2.9.0",
    "email-validator>=2.2.0",
    "jinja2>=3.1.4",
    "reportlab>=4.2.0",        # assignment PDF rendering
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-python-dateutil",
    "faker>=33.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
