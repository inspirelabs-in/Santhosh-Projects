[project]
name = "hiring-agent-emotion-service"
version = "0.1.0"
description = "Paralinguistic + emotion features for voice screen audio"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # Audio + ML stack
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
    "transformers>=4.45.0",
    "librosa>=0.10.2",
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
